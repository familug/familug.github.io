name: Pelican site CI

on:
  push:
    branches:
      - main
      - testci
    strategy:
      matrix:
        python-version: ["3.12"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 2
    - run: ls -R ${{ github.workspace }}
    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - run: |
        pip install -r requirements.txt ghp-import
        pelican content -o output -s pelicanconf.py
        ghp-import output -b gh-pages
        git push origin gh-pages --force
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        GH_PAGES_BRANCH: gh-pages
        PELICAN_CONFIG_FILE: publishconf.py

    - name: Sync changed posts to Blogger
      if: github.ref == 'refs/heads/main'
      run: |
        pip install google-api-python-client google-auth-oauthlib markdown
        printf '%s' "$BLOGGER_CREDENTIALS_JSON" > credentials.json
        printf '%s' "$BLOGGER_TOKEN_JSON" > token.json
        CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'content/*.md' || true)
        if [ -n "$CHANGED" ]; then
          echo "Changed files: $CHANGED"
          python sync_to_blogger.py --files "$CHANGED"
        else
          echo "No markdown files changed, skipping Blogger sync."
        fi
      env:
        BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        BLOGGER_CREDENTIALS_JSON: ${{ secrets.BLOGGER_CREDENTIALS_JSON }}
        BLOGGER_TOKEN_JSON: ${{ secrets.BLOGGER_TOKEN_JSON }}

    - name: Cleanup credentials
      if: always()
      run: rm -f credentials.json token.json
